name: Build and Push Docker image to GHCR

on:
  push:
    branches:
      - prod  # or whichever branch you want to trigger on
    paths:
      - docker/**
      - .github/workflows/build-and-push-image.yaml
  workflow_dispatch:  # allows manual trigger


env:
    IMAGE_NAME: dell-hardware-exporter

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # important: needed to push to GHCR
      id-token: write  # optional: for improved auth

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        cd docker
        docker build -t ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest .

    - name: Push Docker image
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
