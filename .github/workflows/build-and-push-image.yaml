name: Build and Push Docker image to GHCR

on:
  push:
    branches:
      - prod  # or whichever branch you want to trigger on
    paths:
      - docker/**
      - .github/workflows/build-and-push-image.yaml
  workflow_dispatch:  # allows manual trigger


env:
    IMAGE_NAME: dell-hardware-exporter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}

    permissions:
      contents: read
      packages: write  # important: needed to push to GHCR
      id-token: write  # optional: for improved auth

    steps:
    - name: Checkout code
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493

    - name: Fetch Grafana Token from Terraform Cloud
      id: fetch-token
      run: |
        set -euo pipefail
        # If the token is provided directly as a GitHub secret, prefer that.
        if [ -n "${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}" ]; then
          echo "::add-mask::$GRAFANA_SERVICE_ACCOUNT_TOKEN"
          echo "grafana_token=$GRAFANA_SERVICE_ACCOUNT_TOKEN" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Get all variable sets for the organization
        echo "Fetching variable sets for organization: ${{ env.TF_CLOUD_ORGANIZATION }}"
        VARSETS_RESPONSE=$(curl -s \
          --header "Authorization: Bearer ${{ env.TF_API_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          "https://app.terraform.io/api/v2/organizations/${{ env.TF_CLOUD_ORGANIZATION }}/varsets")
        
        # Find the "K8S Cluster Variables" variable set
        VARSET_ID=$(echo "$VARSETS_RESPONSE" | jq -r '.data[] | select(.attributes.name == "K8S Cluster Variables") | .id')
        
        if [ "$VARSET_ID" == "null" ] || [ -z "$VARSET_ID" ]; then
          echo "Error: Variable set 'K8S Cluster Variables' not found"
          echo "Available variable sets:"
          echo "$VARSETS_RESPONSE" | jq -r '.data[] | .attributes.name'
          exit 1
        fi
        
        echo "Found variable set ID: $VARSET_ID"
        
        # Get variables from the variable set
        VARIABLES_RESPONSE=$(curl -s \
          --header "Authorization: Bearer ${{ env.TF_API_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          "https://app.terraform.io/api/v2/varsets/$VARSET_ID/relationships/vars")
        
        # Find the variable id (value will be null if the variable is marked sensitive)
        VAR_ID=$(echo "$VARIABLES_RESPONSE" | jq -r '.data[] | select(.attributes.key == "grafana_service_account_token") | .id')
        if [ "$VAR_ID" == "null" ] || [ -z "$VAR_ID" ]; then
          echo "Error: grafana_service_account_token not found in variable set"
          echo "Available variables in set:"
          echo "$VARIABLES_RESPONSE" | jq -r '.data[] | .attributes.key'
          exit 1
        fi

        # Retrieve the variable details (non-sensitive values are returned; sensitive ones are not)
        VAR_DETAILS=$(curl -s \
          --header "Authorization: Bearer ${{ env.TF_API_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          "https://app.terraform.io/api/v2/vars/$VAR_ID")

        GRAFANA_TOKEN=$(echo "$VAR_DETAILS" | jq -r '.data.attributes.value')
        if [ "$GRAFANA_TOKEN" == "null" ] || [ -z "$GRAFANA_TOKEN" ]; then
          echo "Error: grafana_service_account_token is marked sensitive in Terraform Cloud, and sensitive values cannot be retrieved via the API."
          echo "Provide the token via the GitHub secret GRAFANA_SERVICE_ACCOUNT_TOKEN or make the variable non-sensitive in Terraform Cloud."
          exit 1
        fi
        
        echo "::add-mask::$GRAFANA_TOKEN"
        echo "grafana_token=$GRAFANA_TOKEN" >> $GITHUB_OUTPUT

    - name: Update agent.yaml with Grafana token
      run: |
        # Replace the placeholder token in agent.yaml with the fetched token
        sed -i 's/GRAFANA_API_KEY_PLACEHOLDER/${{ steps.fetch-token.outputs.grafana_token }}/' docker/agent.yaml

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        cd docker
        docker build --platform=linux/amd64 -t ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest .

    - name: Push Docker image
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
