name: Build and Push Docker image to GHCR

on:
  push:
    branches:
      - prod  # or whichever branch you want to trigger on
    paths:
      - docker/**
      - .github/workflows/build-and-push-image.yaml
  workflow_dispatch:  # allows manual trigger


env:
    IMAGE_NAME: dell-hardware-exporter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}

    permissions:
      contents: read
      packages: write  # important: needed to push to GHCR
      id-token: write  # optional: for improved auth

    steps:
    - name: Checkout code
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493

    - name: Fetch Grafana Token from Terraform Cloud
      id: fetch-token
      run: |
        # Get workspace ID first
        WORKSPACE_ID=$(curl -s \
          --header "Authorization: Bearer ${{ env.TF_API_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          "https://app.terraform.io/api/v2/organizations/${{ env.TF_CLOUD_ORGANIZATION }}/workspaces/k8s-cluster-grafana" \
          | jq -r '.data.id')
        
        echo "Workspace ID: $WORKSPACE_ID"
        
        # Get all variables for the workspace
        VARIABLES_RESPONSE=$(curl -s \
          --header "Authorization: Bearer ${{ env.TF_API_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          "https://app.terraform.io/api/v2/workspaces/$WORKSPACE_ID/vars")
        
        # Find the grafana_service_account_token variable
        GRAFANA_TOKEN=$(echo "$VARIABLES_RESPONSE" | jq -r '.data[] | select(.attributes.key == "grafana_service_account_token") | .attributes.value')
        
        if [ "$GRAFANA_TOKEN" == "null" ] || [ -z "$GRAFANA_TOKEN" ]; then
          echo "Error: grafana_service_account_token not found in workspace variables"
          exit 1
        fi
        
        echo "::add-mask::$GRAFANA_TOKEN"
        echo "grafana_token=$GRAFANA_TOKEN" >> $GITHUB_OUTPUT

    - name: Update agent.yaml with Grafana token
      run: |
        # Replace the hardcoded token in agent.yaml with the fetched token
        sed -i 's/password = ".*"/password = "${{ steps.fetch-token.outputs.grafana_token }}"/' docker/agent.yaml

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        cd docker
        docker build -t ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest .

    - name: Push Docker image
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
