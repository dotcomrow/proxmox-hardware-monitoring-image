name: Build and Push Docker image to GHCR

on:
  push:
    branches:
      - prod  # or whichever branch you want to trigger on
    paths:
      - docker/**
      - .github/workflows/build-and-push-image.yaml
  workflow_dispatch:  # allows manual trigger


env:
    IMAGE_NAME: dell-hardware-exporter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}

    permissions:
      contents: read
      packages: write  # important: needed to push to GHCR
      id-token: write  # optional: for improved auth

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Fetch Grafana Token from Terraform Cloud
      id: fetch-token
      run: |
        # Create a temporary Terraform configuration to fetch the variable
        cat > fetch_vars.tf << 'EOF'
        terraform {
          cloud {
            workspaces {
              name = "k8s-cluster-grafana"
            }
          }
        }

        variable "grafana_service_account_token" {
          description = "Grafana service account token from K8S Cluster Variables"
          type        = string
          sensitive   = true
        }

        output "grafana_token" {
          value     = var.grafana_service_account_token
          sensitive = true
        }
        EOF

        # Initialize and get the token
        terraform init
        GRAFANA_TOKEN=$(terraform output -raw grafana_token)
        echo "::add-mask::$GRAFANA_TOKEN"
        echo "grafana_token=$GRAFANA_TOKEN" >> $GITHUB_OUTPUT

    - name: Update agent.yaml with Grafana token
      run: |
        # Replace the hardcoded token in agent.yaml with the fetched token
        sed -i 's/password = ".*"/password = "${{ steps.fetch-token.outputs.grafana_token }}"/' docker/agent.yaml

    - name: Cleanup Terraform files
      run: |
        rm -f fetch_vars.tf
        rm -rf .terraform*

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        cd docker
        docker build -t ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest .

    - name: Push Docker image
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
