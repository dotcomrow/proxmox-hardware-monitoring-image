prometheus.exporter.unix "dell_metrics" {
  set_collectors = ["textfile"]
  textfile {
    directory = "/opt/dell-exporter"
  }
}

prometheus.scrape "dell_exporter" {
  scrape_interval = "60s"
  targets    = prometheus.exporter.unix.dell_metrics.targets
  job_name   = "dell_exporter"
  forward_to = [prometheus.remote_write.grafana.receiver]
}

prometheus.remote_write "grafana" {
  endpoint {
    url = "https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push"
    basic_auth {
      username = "2361797"
      password = "GRAFANA_API_KEY_PLACEHOLDER"
    }
  }
}

// OTLP ingress -> forward to Grafana Cloud via remote_write
otelcol.receiver.otlp "proxmox" {
  protocols {
    grpc {
      endpoint = "0.0.0.0:4317"
    }
    http {
      endpoint = "0.0.0.0:4318"
    }
  }
}

otelcol.processor.batch "default" {}

otelcol.exporter.prometheusremotewrite "grafana" {
  endpoint = "https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push"
  headers = {
    "Authorization" = "Basic PROM_REMOTE_AUTH_PLACEHOLDER"
  }
}

otelcol.pipeline.metrics "proxmox" {
  receivers  = [otelcol.receiver.otlp.proxmox]
  processors = [otelcol.processor.batch.default]
  exporters  = [otelcol.exporter.prometheusremotewrite.grafana]
}
